name: chz-cat-town
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chz_dev_only}
      POSTGRES_DB: chz
    volumes:
      - town-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U chz -d chz]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://chz:${POSTGRES_PASSWORD:-chz_dev_only}@db:5432/chz
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5180,http://127.0.0.1:5180,http://localhost:5173,http://127.0.0.1:5173}
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:5173"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    depends_on:
      backend:
        condition: service_healthy
volumes:
  town-data:
